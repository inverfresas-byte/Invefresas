        </nav>

    <main>

        <section class="formulario">

            <div class="titulo-formulario">

                <p class="subtitulo">QUEREMOS CONOCERTE</p>

                <h1>Formulario de <span>INVERFRESAS</span></h1>

                <p>
                    Déjanos tus datos y cuéntanos qué quieres decirnos.
                </p>

            </div>


            <form class="formulario-contacto">

                <div class="fila-formulario">

                    <div class="campo">
                        <label for="nombre">First name</label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Escribe tu nombre"
                            required>
                    </div>


                    <div class="campo">
                        <label for="apellido">Last name</label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Escribe tu apellido"
                            required>
                    </div>

                </div>


            

                <div class="fila-formulario">

                    <div class="campo">
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required>
                    </div>


                    <div class="campo">
                        <label for="direccion">Dirección</label>

                        <input
                            type="text"
                            id="direccion"
                            name="direccion"
                            placeholder="Escribe tu dirección">
                    </div>

                </div>


                <div class="campo campo-mensaje">

                    <label for="mensaje">Mensaje</label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        placeholder="Escribe tu mensaje aquí..."
                        required></textarea>

                </div>


                <button type="submit" class="boton">
                    Enviar
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 INVERFRESAS | Proyecto Productivo
        </p>

    </footer>
    <script src="java/script.js"></script>

</body>
